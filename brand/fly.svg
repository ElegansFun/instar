<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 300 300" width="600" height="600">
  <title>Drosophila melanogaster, adult male, dorsal</title>
  <defs>
    <g id="wing" fill="none" stroke="#141311" stroke-linecap="round" stroke-linejoin="round">
      <!-- hinge at 0,0; the tip along +x -->
      <path d="M0 0 C 12 -16, 46 -24, 88 -20 C 118 -17, 136 -6, 136 4 C 136 14, 114 24, 80 24 C 44 24, 14 16, 0 0 Z" fill="#F3EEE3" fill-opacity="0.72" stroke-width="1.5"/>
      <path d="M3 -4 C 36 -18, 80 -21, 128 -10" stroke-width="0.8"/>
      <path d="M5 -1 C 36 -9, 84 -9, 134 2" stroke-width="0.8"/>
      <path d="M7 3 C 36 0, 70 3, 116 15" stroke-width="0.8"/>
      <path d="M9 7 C 30 9, 54 15, 82 23" stroke-width="0.8"/>
      <path d="M48 -15 L 47 -7" stroke-width="0.8"/>
      <path d="M86 -10 L 84 4" stroke-width="0.8"/>
    </g>
    <g id="half" fill="none" stroke="#141311" stroke-linecap="round" stroke-linejoin="round">
      <!-- legs: coxa at the thorax, femur, tibia, tarsus -->
      <path d="M166 96 L 190 76 L 214 54 L 232 30" stroke-width="2.6"/>
      <path d="M214 54 L 232 30" stroke-width="1.6"/>
      <path d="M170 112 L 202 116 L 234 128 L 262 142" stroke-width="2.6"/>
      <path d="M234 128 L 262 142" stroke-width="1.6"/>
      <path d="M166 130 L 190 158 L 206 190 L 216 222" stroke-width="2.6"/>
      <path d="M206 190 L 216 222" stroke-width="1.6"/>
      <!-- tarsal claws -->
      <path d="M232 30 l 3 -4 M232 30 l 4 1 M262 142 l 4 -2 M262 142 l 2 4 M216 222 l 4 -1 M216 222 l 1 4" stroke-width="1.1"/>
      <!-- haltere -->
      <path d="M170 128 l 12 8" stroke-width="1.4"/>
      <circle cx="183" cy="136.5" r="3" fill="#141311" stroke="none"/>
    </g>
    <g id="front" fill="none" stroke="#141311" stroke-linecap="round" stroke-linejoin="round">
      <!-- antenna with arista -->
      <path d="M156 42 l 4 -9" stroke-width="1.4"/>
      <path d="M160 33 l 6 -8 M162 30 l 5 2 M164 28 l 1 5 M165 27 l 6 -1" stroke-width="0.9"/>
      <!-- compound eye, over the head capsule -->
      <path d="M160 44 C 172 34, 186 44, 185 62 C 184 78, 172 84, 162 76 C 154 70, 153 54, 160 44 Z" fill="#C98A2B" stroke-width="1.5"/>
      <path d="M162 50 l 17 4 M159 57 l 22 4 M159 64 l 21 4 M162 71 l 15 3 M166 45 l 10 3" stroke-width="0.6" stroke-opacity="0.65"/>
    </g>
  </defs>
  <!-- wings lie behind the body -->
  <use xlink:href="#wing" transform="translate(166 106) rotate(34)"/>
  <use xlink:href="#wing" transform="translate(134 106) scale(-1 1) rotate(34)"/>
  <use xlink:href="#half"/>
  <use xlink:href="#half" transform="translate(300 0) scale(-1 1)"/>
  <g fill="#F3EEE3" stroke="#141311" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
    <!-- abdomen, tergites banded, the male's dark tip -->
    <path d="M124 128 C 116 148, 116 176, 128 200 C 138 218, 162 218, 172 200 C 184 176, 184 148, 176 128 Z"/>
    <path d="M121 142 C 136 150, 164 150, 179 142" stroke-width="1.2"/>
    <path d="M119 158 C 136 166, 164 166, 181 158" stroke-width="1.2"/>
    <path d="M120 174 C 136 182, 164 182, 180 174" stroke-width="1.2"/>
    <path d="M125 190 C 138 197, 162 197, 175 190" stroke-width="1.2"/>
    <path d="M129 200 C 138 214, 162 214, 171 200 Z" fill="#141311" stroke-width="1.2"/>
    <!-- thorax: mesonotum and scutellum -->
    <path d="M122 88 C 122 66, 178 66, 178 88 C 182 108, 176 126, 150 134 C 124 126, 118 108, 122 88 Z"/>
    <path d="M132 118 C 140 128, 160 128, 168 118" stroke-width="1"/>
    <path d="M134 82 l -2 -7 M166 82 l 2 -7 M128 96 l -4 -5 M172 96 l 4 -5 M130 110 l -4 -3 M170 110 l 4 -3 M142 74 l -1 -6 M158 74 l 1 -6" fill="none" stroke-width="1.1"/>
    <!-- head -->
    <path d="M130 54 C 130 30, 170 30, 170 54 C 170 68, 162 78, 150 84 C 138 78, 130 68, 130 54 Z"/>
    <circle cx="150" cy="36" r="1.6" fill="#141311" stroke="none"/>
    <circle cx="146" cy="40" r="1.3" fill="#141311" stroke="none"/>
    <circle cx="154" cy="40" r="1.3" fill="#141311" stroke="none"/>
    <path d="M147 76 l 3 8 l 3 -8" fill="none" stroke-width="1.3"/>
  </g>
  <use xlink:href="#front"/>
  <use xlink:href="#front" transform="translate(300 0) scale(-1 1)"/>
</svg>
